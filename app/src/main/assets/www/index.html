  <style>
    :root {

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    .app {
      display: flex;

      height: 100dvh;

    .nav-actions { display: flex; gap: 6px; align-items: center; }

      background: transparent;
      color: var(--text);

      cursor: pointer;
      min-height: 36px;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    body.theme-night button.primary { color: #090B0E; font-weight: 600; }
    main { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: hidden; position: relative; }
    .page-viewport { width: 100%; max-width: 680px; height: 100%; min-height: 0; padding: 16px 20px; overflow: hidden; display: flex; flex-direction: column; }
    .page-content { flex: 1; min-height: 0; overflow: hidden; }
    .oracle-bar {
      flex-shrink: 0;
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: none;
      align-items: center;
      justify-content: flex-start;
    }
    .oracle-bar.visible { display: flex; }
    footer {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 13px;
      gap: 6px;
    }
    .meta { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
    #apk-page-input {
      width: 78px;
      height: 36px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-appearance: none;
    }
    .drop-cap::first-letter { font-size: 3.1em; line-height: 0.8; float: left; margin-right: 0.14em; margin-top: 0.08em; font-weight: 700; color: var(--accent); }
    .box-enc { margin: 12px 0; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .box-dos { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
    .drawer.open { display: flex; }
    .sheet {
      width: 100%;
      max-width: 560px;
      max-height: 85dvh;
      background: var(--bg);
      color: var(--text);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      border-top: 1px solid var(--border);
    }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  </style>

  <script>
    (function() {
      const INITIAL_CHAPTERS_RU = [{"id":"chapter-1","number":1,"title":"Школа на Аэдене и зеркало Земли-18","subtitle":"О том, как восемнадцатый уровень сознания отражается в коридорах власти, корпорациях и тайных картах мира","epigraph":"«Человек видит в истории лишь марионеток на авансцене; муравей чувствует лишь тень Пальцев; но истинный Бог замечает, что сама карта может оказаться аквариумом под куполом». — Эдмон Уэллс","summary":"На острове Олимпия в Аэдене ученики-боги Мишель Пэнсон и Рауль Разорбак на восемнадцатом уровне сознания ведут наблюдение за современной Землёй-18. Опираясь на «Энциклопедию относительного и абсолютного знания» Эдмона Уэллса и память прежних жизней танатонавтов и ангелов, они исследуют тайные узлы мироздания, гипотезу Плоской земли и ледяного купола, власть теневых корпораций и скрытую дипломатию США, России, Китая, Израиля и Украины.","paragraphs":["Когда в аудитории восемнадцатого уровня на острове Олимпия погас искусственный закат, Мишель Пэнсон заметил, что проекция Земли-18 на мраморном столе ведёт себя странно: с высоты богов она казалась вращающимся синим шаром, но стоило приблизить взгляд, как привычные континенты разворачивались в плоский диск с замкнутым ледяным кольцом по краю. Воздух в зале пах озоном и старым пергаментом, точно перед грозой, о которой не предупреждал ни один земной барометр. Рядом Рауль Разорбак усмехался, наблюдая, как ночные огни Вашингтона, Москвы, Пекина, Иерусалима и Киева перемигиваются во мраке подобно нервным узлам гигантского муравейника.","— Ты всё ещё веришь, что земные президенты и советы директоров корпораций сами чертят границы мира? — спросил Рауль, касаясь кончиком мизинца пульсирующей нити между кабинетами США, России, Китая, Израиля и Украины. — Внизу миллионы людей разбирают каждое слово Дональда Трампа и Владимира Путина, спорят о пекинских алгоритмах, ближневосточных шифрах и эмблеме ООН с азимутальной картой. И почти никто не замечает главного подвоха: человечеству уже сегодня предлагают безупречный, мягкий цифровой рай — в обмен на тихий отказ от собственной воли.","Мишель промолчал и опустил ладонь к холодному мрамору, чтобы увеличить масштаб над Тихим океаном и Антарктидой. Сразу бросилась в глаза странная асимметрия гражданской авиации: пока в Северном полушарии самолёты чертили плотную паутину прямых трасс, на юге перелёты между материками обходили шестидесятую параллель широкой петлёй, словно над белым континентом висел невидимый знак запрета. Старые хроники танатонавтов называли такие места швами декораций — там, где реальность начинает слегка фонить, если приложить к ней живое любопытство.","— Помнишь, каким шоком для нас стал первый выход за предел клинической смерти? — негромко сказал Мишель, поворачиваясь к другу. — Тогда люди думали, будто за границей сердца остаётся либо пустота, либо облачные врата с арфами. А мы с тобой увидели семь светлых барьеров, весы Света и тысячи душ, которые боялись даже посмотреть назад на свою серебряную нить. Сегодня на Земле-18 происходит то же самое, только в обратном порядке: людям строят искусственное небо раньше, чем они научились понимать собственное сознание.","На верхний ярус аудитории бесшумно поднялась наставница Афина в простом белом хитоне и поставила на кафедру два странных предмета: стеклянный террариум с несколькими рыжими муравьями из породы Бел-о-кана и миниатюрный биржевой терминал, мигающий зелёными котировками. Ученики Олимпии тут же притихли — каждый знал, что за простыми примерами Афины всегда скрывается формула, объясняющая устройство целых империй лучше толстых учебников по политологии.","— Посмотрите внимательно на этот стеклянный куб, — произнесла она голосом, от которого зазвенели тонкие подвески светильников. — Когда я опускаю в террариум палец с каплей мёда, крайние разведчики принимают это за дар небес, а солдаты — за вторжение неведомого монстра. На вашей Земле-18 роль невидимых феромонов выполняют расчётные алгоритмы пятнадцати глобальных фондов, чьи доли одновременно лежат и в оборонных концернах Вашингтона, и в лабораториях Кремниевой долины, и в логистических шлюзах Востока. Толпа видит вражду флагов, а бухгалтерия видит единый баланс.","Мишель раскрыл потрёпанный том «Энциклопедии относительного и абсолютного знания», оставленный ему старым учителем Эдмоном Уэллсом ещё в те годы, когда они вдвоём с Раулем впервые пересекали границы смерти. Между страницами о поведении термитов и тайных чертежах Пири Рейса лежала выцветшая закладка с почерком мастера: «Власть удерживается не грубой силой стражи, а умением убедить обитателей аквариума, что за толстым стеклом нечего искать». Внизу на карте именно в эту секунду зажглись красные маячки сразу над тремя закрытыми саммитами в Швейцарии.","Рауль наклонился ближе к проекции Восточного полушария, разглядывая, как цифровые шлюзы Пекина переплетаются с квантовой оптикой Тель-Авива и автономными роями над причерноморскими степями. По его губам скользнула знакомая ироничная тень: в отделе распределительных иллюзий Аэдена стажёрам когда-то показывали учебный симулятор «Добро пожаловать в рай» — историю о курорте посмертия, где каждое желание исполнялось мгновенно, пока новичок не дочитывал мелкий шрифт договора. На Земле-18 этот контракт уже печатался без всякого посмертия — прямо внутри соглашений о цифровой безопасности и вечном комфорте.","— И всё-таки ты упускаешь один крошечный элемент, Рауль, — возразил Мишель, указывая на едва заметную золотую точку, вспыхнувшую посреди обычного жилого квартала далеко от дворцов и штаб-квартир. — Вспомни 103683-го муравья. Пока миллионы его сородичей бежали по привычному феромонному следу, одна-единственная особь осмелилась остановиться и задать вопрос не о победе, а о смысле самой дороги. Наши правила на Олимпии запрещают прямые приказы людям — мы можем посылать лишь сны, совпадения и внезапную ясность. Но иногда одной ясной мысли хватает, чтобы сбить прогноз самого дорогого суперкомпьютера.","В аудитории снова мягко зажёгся утренний полусвет Аэдена, отражаясь в медной оправе земного глобуса. За фасадами земных столиц, биржевыми серверами корпораций и закрытыми антарктическими широтами в ту секунду сошлись серебряные нити нового витка истории — и древняя книга на кафедре сама перевернулась на следующую чистую страницу, приглашая читателя увидеть то, что обычно остаётся за скобками вечерних новостей."],"encyclopediaEntry":{"term":"Закон восемнадцатого порога","category":"Энциклопедия · Метаистория","text":"Согласно заметкам Эдмона Уэллса, любое сложное сообщество — от колонии термитов до сверхдержав и корпоративных холдингов — при достижении критической плотности информации распадается на две реальности: видимую для толпы и закрытую для посвящённых. То, что на Земле называют конспирологией, на деле служит прибором ночного видения, улавливающим чертёж раньше официальных новостей."},"dossierNote":{"code":"ОЛИМПИЯ-01 · ПОЛИФОНИЯ СВЕРХДЕРЖАВ","title":"США, Россия, Китай, Израиль и Украина на одной доске","text":"Наблюдение фиксирует не отдельные разрозненные кризисы, а единую перенастройку мирового узла. За речами Вашингтона и Москвы, цифровыми шагами Пекина, киберконтурами Иерусалима и линией разлома в Украине прослеживается борьба транснациональных корпораций за контроль над чипами, энергетикой, орбитой и программируемыми деньгами."},"source":"core","createdAt":"2026-11-20T00:00:00.000Z"}];
      const INITIAL_CHAPTERS_EN = [{"id":"chapter-1-en","number":1,"title":"The School of Aeden and the Mirror of Earth-18","subtitle":"How the eighteenth level of consciousness reflects inside corridors of power, mega-corporations, and secret maps","epigraph":"“Humans see only puppets on the stage of history; ants sense only the shadow of the Fingers; yet a true God notices that the map itself may be an aquarium beneath a dome.” — Edmond Wells","summary":"On the island of Olympia in Aeden, student gods Michael Pinson and Raoul Razorbak observe contemporary Earth-18 from the eighteenth level of consciousness. Guided by Edmond Wells’ Encyclopedia of Relative and Absolute Knowledge and memories of past lives as Thanatonauts and guardian angels, they investigate cosmic mysteries, Flat Earth and dome anomalies, transnational mega-corporations, and hidden corridors linking the USA, Russia, China, Israel, and Ukraine.","paragraphs":["When the artificial sunset faded inside the eighteenth-level lecture hall on the island of Olympia, Michael Pinson noticed something uncanny about Earth-18 resting on the marble table: from divine altitude it spun as a luminous blue sphere, yet upon zooming in it unfolded into a flat disc ringed by an unbroken wall of Antarctic ice. The hall smelled of storm ozone and aged vellum, like air right before a shift no terrestrial barometer could measure. Beside him, Raoul Razorbak smiled wryly as the night lights of Washington, Moscow, Beijing, Jerusalem, and Kyiv pulsed in the dark like nerve ganglia inside an immense anthill.","“Do you still believe earthly presidents and corporate boards draw those borders by themselves?” Raoul asked, touching his fingertip to a glowing thread linking corridors across the United States, Russia, China, Israel, and Ukraine. “Down below, millions dissect every syllable from Donald Trump and Vladimir Putin, track Beijing’s algorithmic grids and Middle Eastern flashpoints, and stare at the flat azimuthal map on the UN emblem—never realizing they are being offered a spotless, frictionless digital paradise in exchange for silently surrendering their own free will.”","Michael kept silent and lowered his palm over the cool marble to magnify the curve uniting the South Pacific and Antarctica. An odd asymmetry stood out at once across civilian aviation tracks: while the northern hemisphere wove dense webs of straight-line flights, southern crossings curved in wide detours clear of the sixtieth parallel, as if an invisible cordon hung above the white continent. Old Thanatonaut logs called such places stage seams—spots where scenery begins to hum faintly whenever a seeker presses a curious hand against the backdrop.","“Remember how stunned we were the first time we crossed past clinical death?” Michael murmured, turning toward his friend. “Back then mortals imagined only blank nothingness or pearly clouds with harps. Yet we met seven luminous barriers, the Scales of Light, and thousands of souls too timid even to glance back along their own silver cord. On Earth-18 the exact same drama unfolds in reverse: engineers construct a synthetic sky before people learn how to read their own minds.”","Without a sound, tutor Athena stepped up to the lectern in a plain white chiton and placed two peculiar objects before the class: a glass terrarium housing several red worker ants descended from Bel-o-kan and a miniature trading terminal blinking emerald ticker quotes. The hall fell quiet at once; every student on Olympia knew Athena’s simplest demonstrations hid structural laws capable of explaining whole empires better than thick diplomacy manuals.","“Study this glass cube carefully,” she spoke in a voice that made the fine lamp pendants chime. “Whenever I lower one finger dipped in honey into the nest, outer scouts worship it as grace from heaven while soldiers sound the alarm against a monstrous invader. On your Earth-18, fifteen overlapping investment conglomerates serve as invisible pheromones—holding simultaneous stakes across Washington defense contractors, Silicon Valley data labs, and Eastern clearing gateways. Crowds see clashing flags; the ledger sees one balance sheet.”","Michael opened the worn volume of the Encyclopedia of Relative and Absolute Knowledge left behind by his old mentor Edmond Wells back when he and Raoul first mapped the borders of death. Pressed between essays on termite architecture and Piri Reis portolan mysteries lay a faded bookmark bearing the master’s cramped script: “Dominion endures not through brute guards, but by persuading inhabitants of an aquarium that nothing exists beyond the glass.” At that exact instant, three crimson beacons flared over discreet lakeside estates in Switzerland.","Raoul leaned closer to the Eastern Hemisphere, watching Beijing’s predictive grids intersect Tel Aviv’s quantum encryption optics and autonomous drone swarms across Black Sea steppes. A familiar ironic shadow touched his mouth: in Aeden’s Department of Departures, trainees once ran a simulation called Welcome to Paradise—a luxury afterlife resort where every desire materialized instantly until newcomers read the fine print of their perpetual lease. On Earth-18 that contract was already circulating without any need for death, tucked neatly inside terms of convenience and seamless security.","“Still, you are leaving out one tiny factor, Raoul,” Michael objected, pointing to a faint golden spark lighting up an ordinary residential alley far from palaces and corporate towers. “Think back to ant 103683rd. While millions marched obediently along collective pheromone rails, one stubborn worker paused and asked a question not about conquest, but about the purpose of the road itself. Olympia forbids direct commands to mortals—we can send only dreams, coincidences, and sudden lucidity. Yet one lucid thought often breaks the finest predictive supercomputer.”","Gentle morning glow crept back across Aeden’s amphitheater, catching the brass meridian frame around Earth-18. Behind capital facades, corporate vaults, and sealed polar latitudes, silver threads of a fresh cosmic turn converged at that very second—and the ancient book on the lectern turned to its next blank page all by itself, inviting the reader to notice everything left outside tonight’s official headlines."],"encyclopediaEntry":{"term":"Law of the Eighteenth Threshold","category":"Encyclopedia · Metahistory","text":"According to Edmond Wells, whenever any complex community—from termite colonies to superpowers and holding empires—crosses a critical density of information, it splits into two realities: one staged for citizens and another reserved for architects. What Earth calls conspiracy theory is merely a night-vision lens catching hidden blueprints before press releases arrive."},"dossierNote":{"code":"OLYMPIA-01 · MULTIPOLAR LATTICE","title":"USA, Russia, China, Israel & Ukraine on One Board","text":"Observation reveals not isolated crises but one synchronized planetary realignment. Beneath public statements from Washington and Moscow, Beijing’s algorithmic statecraft, Jerusalem’s cyber-defense corridors, and Ukraine’s geopolitical faultline, transnational conglomerates compete for supremacy over semiconductors, energy, orbital constellations, and programmable currencies."},"source":"core","createdAt":"2026-11-20T00:00:00.000Z"}];

              pushPage();
            }
            const encTargetIdx = ch.paragraphs.length >= 6 ? Math.min(4, Math.floor(ch.paragraphs.length / 2) - 1) : 1;
            if (idx === encTargetIdx && ch.encyclopediaEntry) {
              const enc = { kind: 'enc', ch: chIdx, b: bIdx++, w: 0, ...ch.encyclopediaEntry };
              if (fits([...cur, enc])) cur.push(enc); else { pushPage(); cur = [enc]; }
            }
          });
          if (ch.dossierNote) {
            const dos = { kind: 'dos', ch: chIdx, b: bIdx++, w: 0, ...ch.dossierNote };
            if (fits([...cur, dos])) cur.push(dos); else { pushPage(); cur = [dos]; }
          }
        });
        pushPage();
        document.body.removeChild(m);
        pages = out;
        pageAnchors = outAnchors;
        if (currentAnchor) {
          const mapped = findApkAnchorIndex(pageAnchors, currentAnchor);
          if (mapped >= 0) pageIndex = mapped;
        }
        if (pageIndex >= pages.length) pageIndex = Math.max(0, pages.length - 1);
        if (oracleNum !== null) {
          openOracle(oracleNum, true);
        } else {
          drawPage();
        }
      }

      let isAppendingChapter = false;

      function drawPage() {
        document.getElementById('oracle-bar').classList.remove('visible');
        const box = document.getElementById('page-content');
        box.innerHTML = renderHtml(pages[pageIndex] || []);
        document.getElementById('page-meta').textContent = (lang === 'en' ? 'Page ' : 'Стр. ') + (pageIndex + 1) + ' / ' + Math.max(1, pages.length);
        document.getElementById('btn-prev').disabled = pageIndex === 0;
        currentAnchor = pageAnchors[pageIndex] || null;
        safeSet(lang === 'en' ? 'kb_apk_page_en' : 'kb_apk_page', String(pageIndex));
        if (currentAnchor) {
          safeSet(lang === 'en' ? 'kb_apk_anchor_en' : 'kb_apk_anchor', JSON.stringify(currentAnchor));
        }
        if (!isAppendingChapter && oracleNum === null && pages.length > 0 && pageIndex >= pages.length - 2) {
          appendChapterSilently();
        }
      }

      function buildNextApkBeat() {
        const isEn = lang === 'en';
        const pool = isEn ? OFFLINE_BEATS_EN : OFFLINE_BEATS_RU;
        const dyn = isEn ? DYN_EN : DYN_RU;
        const scenesPool = isEn ? APK_SCENES_EN : APK_SCENES_RU;
        const debatesPool = isEn ? APK_DEBATES_EN : APK_DEBATES_RU;
        const closingsPool = isEn ? APK_CLOSINGS_EN : APK_CLOSINGS_RU;
        const idx = genOffset;
        genOffset++;
        const lastCh = chapters[chapters.length - 1];
        const recent = lastCh && lastCh.paragraphs ? lastCh.paragraphs.slice(-3).join(' ') : '';

        if (idx < pool.length) {
          const base = pool[idx];
          const bridge = recent ? pickApkFreshStr(dyn.bridges, idx + 1, recent) : '';
          const used = recent + ' ' + base.paragraphs.join(' ');
          const scene = pickApkFreshScene(scenesPool, idx * 5 + 2, used);
          const debate = pickApkFreshScene(debatesPool, idx * 7 + 1, used + ' ' + scene.join(' '));
          const closingScene = pickApkFreshScene(closingsPool, idx * 11 + 3, used + ' ' + debate.join(' '));
          const coreParas = base.paragraphs.map((p, pIdx) => (pIdx === 0 && bridge ? bridge + ' ' + p : p));
          const middleFill = coreParas.length < 3 ? [pickApkFreshStr(dyn.mid, idx * 3 + 4, used)] : [];
          const allParas = [...coreParas, ...middleFill, ...scene, ...debate, ...closingScene];
          return {
            title: base.title,
            subtitle: base.subtitle,
            epigraph: base.epigraph,
            paragraphs: allParas,
            enc: base.enc,
            dos: base.dos
          };
        }

        const d = idx - pool.length;
        const bridge = pickApkFreshStr(dyn.bridges, d + 2, recent);
        const opening = pickApkFreshStr(dyn.open, d * 3 + 1, recent);
        const midA = pickApkFreshStr(dyn.mid, d * 5 + 2, recent);
        const midB = pickApkFreshStr(dyn.mid, d * 5 + 7, recent + ' ' + midA);
        const used = recent + ' ' + opening + ' ' + midA + ' ' + midB;
        const scene = pickApkFreshScene(scenesPool, d * 5 + 3, used);
        const debate = pickApkFreshScene(debatesPool, d * 7 + 2, used + ' ' + scene.join(' '));
        const closingScene = pickApkFreshScene(closingsPool, d * 11 + 4, used + ' ' + debate.join(' '));
        const closeLine = pickApkFreshStr(dyn.close, d * 7 + 1, used);
        const encPool = isEn ? INITIAL_ENC_EN : INITIAL_ENC_RU;
        const dosPool = isEn ? INITIAL_DOS_EN : INITIAL_DOS_RU;
        return {
          title: dyn.titles[d % dyn.titles.length],
          subtitle: dyn.subs[d % dyn.subs.length],
          epigraph: '',
          paragraphs: [
            bridge + ' ' + opening,
            midA,
            midB,
            ...scene,
            ...debate,
            closingScene[0],
            closingScene[1] + ' ' + closeLine
          ],
          enc: d % 2 === 0 ? encPool[d % encPool.length] : undefined,
          dos: d % 2 === 1 ? dosPool[d % dosPool.length] : undefined
        };
      }

      function pushNewApkChapter() {
        const beat = buildNextApkBeat();
        const last = chapters[chapters.length - 1];
        if (last && last.title === beat.title && last.paragraphs[0] === beat.paragraphs[0]) {
          return false;
        }
        chapters.push({
          id: 'ch-' + lang + '-' + (last.number + 1) + '-' + genOffset,
          number: last.number + 1,
          title: beat.title,
          subtitle: beat.subtitle,
          epigraph: beat.epigraph,
          paragraphs: [...beat.paragraphs],
          encyclopediaEntry: beat.enc,
          dossierNote: beat.dos
        });
        safeSet(lang === 'en' ? 'kb_apk_chapters_en' : 'kb_apk_chapters', JSON.stringify(chapters));
        safeSet(lang === 'en' ? 'kb_apk_gen_en' : 'kb_apk_gen', String(genOffset));
        return true;
      }

      function appendChapterSilently() {
        if (isAppendingChapter) return;
        isAppendingChapter = true;
        try {
          if (pushNewApkChapter()) paginate();
        } finally {
          isAppendingChapter = false;
        }
      }

      function generateNextPage() {
        if (isAppendingChapter) return;
        isAppendingChapter = true;
        try {
          const prevLen = pages.length;
          if (pushNewApkChapter()) {
            currentAnchor = null;
            pageIndex = prevLen;
            paginate();
          }
        } finally {
          isAppendingChapter = false;
        }
      }

      let oracleNum = null;
      let oracleChapter = null;
      let oraclePages = [];
      let oracleSub = 0;
      let oracleNonce = 0;
      let oracleReturnPageIndex = null;
      let oraclePageCache = {};
      let oracleNavStack = [];
      let oracleHistory = { b: [], i: [], m: [], p: [] };
      try {
        const savedHist = JSON.parse(safeGet('kb_apk_oracle_hist') || 'null');

      function pickApkUnused(len, arr, seed) {
        if (arr.length >= len) arr.length = 0;
        const used = new Set(arr); const pool = [];
        for (let k = 0; k < len; k++) if (!used.has(k)) pool.push(k);
        const idx = pool[Math.abs(seed) % pool.length];
        arr.push(idx); return idx;
      }

      function returnToApkBook() {
        const resumeIdx = oracleReturnPageIndex !== null ? oracleReturnPageIndex : pageIndex;
        oracleNum = null;
        oracleChapter = null;
        oracleReturnPageIndex = null;
        oracleNavStack = [];
        pageIndex = Math.max(0, Math.min(pages.length - 1, resumeIdx));
        drawPage();
      }
      document.getElementById('exit-oracle').onclick = returnToApkBook;

      function openOracle(n, keepExistingChapter, forceFresh, targetSubPage, pushHistory) {
        if (oracleNum === null) {
          oracleReturnPageIndex = pageIndex;
          oracleNavStack = [];
        } else if (pushHistory && oracleNum !== Math.max(1, Math.min(10000, n))) {
          const top = oracleNavStack[oracleNavStack.length - 1];
          if (!top || top.num !== oracleNum) {
            oracleNavStack.push({ num: oracleNum, sub: oracleSub });
          }
        }
        const clamped = Math.max(1, Math.min(10000, n));
        const cacheKey = lang + ':' + clamped;
        if (!keepExistingChapter) {
          if (!forceFresh && oraclePageCache[cacheKey]) {
            oracleChapter = oraclePageCache[cacheKey];
          } else {
            oracleNonce++;
            const seed = clamped * 131 + oracleNonce * 7919 + Date.now();
            const beatsPool = lang === 'en' ? OFFLINE_BEATS_EN : OFFLINE_BEATS_RU;
            const insPool = lang === 'en' ? ORACLE_INSIGHTS_EN : ORACLE_INSIGHTS;
            const metPool = lang === 'en' ? ORACLE_METAPHORS_EN : ORACLE_METAPHORS;
            const impPool = lang === 'en' ? ORACLE_IMPERATIVES_EN : ORACLE_IMPERATIVES;
            const beat = beatsPool[pickApkUnused(beatsPool.length, oracleHistory.b, seed)];
            const ins = insPool[pickApkUnused(insPool.length, oracleHistory.i, seed >> 3)];
            const met = metPool[pickApkUnused(metPool.length, oracleHistory.m, seed >> 5)];
            const imp = impPool[pickApkUnused(impPool.length, oracleHistory.p, seed >> 7)];
            safeSet('kb_apk_oracle_hist', JSON.stringify(oracleHistory));
            oracleChapter = {
              number: clamped,
              title: beat.title,
              subtitle: beat.subtitle,
              paragraphs: [
                beat.paragraphs[0],
                (lang === 'en' ? 'Number ' + clamped + ' opens a turning point. ' : 'Число ' + clamped + ' открывает узел размышления. ') + ins + ' — ' + met + '. ' + imp
              ],
              encyclopediaEntry: beat.enc,
              dossierNote: beat.dos
            };
            oraclePageCache[cacheKey] = oracleChapter;
          }
        }
        oracleNum = clamped;
        const box = document.getElementById('page-content');
        const w = box.clientWidth, h = box.clientHeight;
        if (w < 100 || h < 100) return;
        const m = document.createElement('div');
        m.lang = lang;
        m.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + w + 'px;box-sizing:border-box;visibility:hidden;';
        document.body.appendChild(m);
        const fits = (cand) => { m.innerHTML = renderHtml(cand); return m.scrollHeight <= h + 2; };
        const out = []; let cur = [{ kind: 'header', isOracle: true, number: oracleChapter.number, title: oracleChapter.title, subtitle: oracleChapter.subtitle }];
        oracleChapter.paragraphs.forEach((p, idx) => {
          const words = p.trim().split(/\s+/).filter(Boolean); let pos = 0;
          while (pos < words.length) {
            const rem = words.slice(pos);
            const full = { kind: 'p', text: rem.join(' '), cont: pos > 0, first: idx === 0 };
            if (fits([...cur, full])) { cur.push(full); break; }
            let lo = 1, hi = rem.length - 1, best = 0;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (fits([...cur, { kind: 'p', text: rem.slice(0, mid).join(' '), cont: pos > 0, first: idx === 0 }])) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
            }
            if (best < 3 && cur.length > 0) { out.push(cur); cur = []; continue; }
            if (best === 0) best = 1;
            if (rem.length - best === 1 && best > 3) best--;
            cur.push({ kind: 'p', text: rem.slice(0, best).join(' '), cont: pos > 0, first: idx === 0 });
            pos += best; out.push(cur); cur = [];
          }
        });
        if (cur.length > 0) out.push(cur);
        document.body.removeChild(m);
        oraclePages = out;
        if (targetSubPage === 'last') {
          oracleSub = Math.max(0, oraclePages.length - 1);
        } else if (typeof targetSubPage === 'number') {
          oracleSub = Math.min(Math.max(0, oraclePages.length - 1), Math.max(0, targetSubPage));
        } else if (!keepExistingChapter || oracleSub >= oraclePages.length) {
          oracleSub = 0;
        }
        drawOracle();
      }

      function drawOracle() {
        const resumeNum = (oracleReturnPageIndex !== null ? oracleReturnPageIndex : pageIndex) + 1;
        const resumeLabel = lang === 'en' ? '← Back to reading · p. ' + resumeNum : '← Вернуться к чтению · стр. ' + resumeNum;
        document.getElementById('exit-oracle').textContent = resumeLabel;
        document.getElementById('oracle-bar').classList.add('visible');
        const box = document.getElementById('page-content');
        box.innerHTML = renderHtml(oraclePages[oracleSub] || []);
        document.getElementById('page-meta').textContent = (lang === 'en' ? 'Page ' : 'Стр. ') + oracleNum;
        document.getElementById('btn-prev').disabled = oracleNum <= 1 && oracleSub === 0 && oracleNavStack.length === 0;
      }

      function triggerJump() {
        const inp = document.getElementById('apk-page-input');
        const val = parseInt(inp.value, 10);
        if (!val || val < 1) return;
        const clamped = Math.min(10000, val);
        inp.value = '';

        setTimeout(() => openOracle(clamped, false, true, 0, oracleNum !== null), 140);
      }
      document.getElementById('btn-jump').onclick = triggerJump;

      document.getElementById('btn-prev').onclick = () => {
        if (oracleNum !== null) {
          if (oracleSub > 0) { oracleSub--; drawOracle(); return; }
          const prevVisited = oracleNavStack.pop();
          if (prevVisited) {
            openOracle(prevVisited.num, false, false, prevVisited.sub, false);
            return;
          }
          if (oracleNum <= 1) { returnToApkBook(); return; }
          openOracle(oracleNum - 1, false, false, 'last', false);
          return;
        }
        if (pageIndex > 0) { pageIndex--; drawPage(); }
      };

        if (oracleNum !== null) {
          if (oracleSub < oraclePages.length - 1) { oracleSub++; drawOracle(); }
          else if (oracleNum < 10000) { openOracle(oracleNum + 1, false, false, 0, true); }
          return;

        if (pageIndex < pages.length - 1) { pageIndex++; drawPage(); } else { generateNextPage(); }

      document.getElementById('size-inc').onclick = () => { settings.fontSize = Math.min(24, settings.fontSize + 1); safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };
      document.getElementById('toggle-hyphen').onclick = () => { settings.hyphenation = !settings.hyphenation; safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };
      document.getElementById('toggle-justify').onclick = () => { settings.justifyText = !settings.justifyText; safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };

      let resizeTimer;
      const handleResize = () => {
        const activeId = document.activeElement && document.activeElement.id;
        const box = document.getElementById('page-content');
        if (activeId === 'apk-page-input' && box && box.clientHeight < 420) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(paginate, 120);
      };
      window.addEventListener('resize', handleResize);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', handleResize);

      applyApkLanguageUI();
      setTimeout(paginate, 50);
    })();
  </script>
</body>
</html>
