<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Книга Богов" />
  <title>Книга Богов</title>
  <style>
    :root {
      --bg: #F7F4EE;
      --surface: #EFEAE0;
      --text: #1C1917;
      --muted: #6B655E;
      --border: rgba(28, 25, 23, 0.14);
      --accent: #8B261D;
    }
    body.theme-paper { --bg: #FFFFFF; --surface: #F5F5F4; --text: #18181B; --muted: #64748B; --border: rgba(24,24,27,0.12); --accent: #7C2D12; }
    body.theme-sepia { --bg: #EFE6D5; --surface: #E5D9C3; --text: #2B2118; --muted: #6E5B4B; --border: rgba(43,33,24,0.16); --accent: #78350F; }
    body.theme-night { --bg: #090B0E; --surface: #13171D; --text: #E5E0D6; --muted: #9A948A; --border: rgba(229,224,214,0.14); --accent: #D4AF63; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, 'Times New Roman', serif;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    header {
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    .brand { font-family: Georgia, serif; font-size: 18px; font-weight: 700; letter-spacing: 0.01em; white-space: nowrap; }
    .nav-actions { display: flex; gap: 6px; align-items: center; }
    button {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 13px;
      cursor: pointer;
      min-height: 36px;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    body.theme-night button.primary { color: #090B0E; font-weight: 600; }
    main { flex: 1; min-height: 0; display: flex; justify-content: center; overflow: hidden; position: relative; }
    .page-viewport { width: 100%; max-width: 680px; height: 100%; min-height: 0; padding: 16px 20px; overflow: hidden; display: flex; flex-direction: column; }
    .page-content { flex: 1; min-height: 0; overflow: hidden; }
    .oracle-bar {
      flex-shrink: 0;
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: none;
      align-items: center;
      justify-content: flex-start;
    }
    .oracle-bar.visible { display: flex; }
    footer {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      font-size: 13px;
      gap: 6px;
    }
    .meta { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
    #apk-page-input {
      width: 78px;
      height: 36px;
      padding: 4px 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: center;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-appearance: none;
    }
    .drop-cap::first-letter { font-size: 3.1em; line-height: 0.8; float: left; margin-right: 0.14em; margin-top: 0.08em; font-weight: 700; color: var(--accent); }
    .box-enc { margin: 12px 0; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .box-dos { margin: 12px 0; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
    .drawer { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
    .drawer.open { display: flex; }
    .sheet {
      width: 100%;
      max-width: 560px;
      max-height: 85dvh;
      background: var(--bg);
      color: var(--text);
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      border-top: 1px solid var(--border);
    }
    .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .theme-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
  </style>
</head>
<body class="theme-parchment">
  <div class="app">
    <header>
      <div class="brand" id="brand-title">Книга Богов</div>
      <div class="nav-actions">
        <div style="display:inline-flex;border:1px solid var(--border);border-radius:8px;padding:2px;">
          <button id="lang-ru" style="min-height:28px;padding:3px 7px;font-size:11px;border:none;">RU</button>
          <button id="lang-en" style="min-height:28px;padding:3px 7px;font-size:11px;border:none;">ENG</button>
        </div>

        <button id="btn-settings">Настройки</button>

    <main id="touch-area">

        <div class="page-content" id="page-content"></div>
      </div>

      <button id="btn-prev" aria-label="Назад">←</button>

        <input id="apk-page-input" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="10000" placeholder="1-10000" />
        <button id="btn-jump">Открыть</button>
      </div>
      <button id="btn-next" class="primary" aria-label="Далее">→</button>
    </footer>
  </div>

  <div class="drawer" id="drawer-settings">
    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <strong id="lbl-settings-title" style="font-size:17px;">Настройки чтения (Офлайн)</strong>
        <button id="close-settings">Закрыть</button>
      </div>
      <div style="margin-bottom:12px;">
        <div id="lbl-theme-title" style="font-size:13px;color:var(--muted);">Тема страницы</div>

          <button data-theme="parchment" id="thm-parchment">Пергамент</button>
          <button data-theme="paper" id="thm-paper">Бумага</button>
          <button data-theme="sepia" id="thm-sepia">Сепия</button>
          <button data-theme="night" id="thm-night">Ночь</button>
        </div>
      </div>
      <div class="row">
        <span><span id="lbl-font-title">Размер шрифта</span> (<span id="lbl-size">18</span>px)</span>
        <div style="display:flex;gap:8px;">
          <button id="size-dec">A-</button>
          <button id="size-inc">A+</button>
        </div>
      </div>
      <div class="row">
        <span id="lbl-hyphen-title">Перенос слов по слогам</span>
        <button id="toggle-hyphen">Вкл</button>
      </div>
      <div class="row">
        <span id="lbl-justify-title">Выравнивание по ширине</span>
        <button id="toggle-justify">Вкл</button>
      </div>
    </div>
  </div>

    <div class="sheet">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <strong id="lbl-archive-title" style="font-size:17px;">Энциклопедия и Досье</strong>
        <button id="close-archive">Закрыть</button>
      </div>
      <div id="archive-list" style="display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.5;"></div>
    </div>
  </div>

      const INITIAL_CHAPTERS_RU = [{"id":"chapter-1","number":1,"title":"Школа на Аэдене и зеркало Земли-18","subtitle":"О том, как восемнадцатый уровень сознания отражается в коридорах власти, корпорациях и тайных картах мира","epigraph":"«Человек видит в истории лишь марионеток на авансцене; муравей чувствует лишь тень Пальцев; но истинный Бог замечает, что сама карта может оказаться аквариумом под куполом». — Эдмон Уэллс","summary":"На острове Олимпия в Аэдене ученики-боги Мишель Пэнсон и Рауль Разорбак на восемнадцатом уровне сознания ведут наблюдение за современной Землёй-18. Опираясь на «Энциклопедию относительного и абсолютного знания» Эдмона Уэллса и память прежних жизней танатонавтов и ангелов, они исследуют тайные узлы мироздания, гипотезу Плоской земли и ледяного купола, власть теневых корпораций и скрытую дипломатию США, России, Китая, Израиля и Украины.","paragraphs":["Когда в аудитории восемнадцатого уровня на острове Олимпия погас искусственный закат, Мишель Пэнсон заметил, что проекция Земли-18 на мраморном столе ведёт себя странно: с высоты богов она казалась вращающимся шаром, но при приближении разворачивалась в плоский диск с ледяным кольцом по краю. Рядом Рауль Разорбак усмехался, наблюдая, как огоньки Вашингтона, Москвы, Пекина, Иерусалима и Киева перемигиваются в ночи подобно нервным узлам гигантского муравейника.","— Ты всё ещё веришь, что земные президенты и советы директоров корпораций сами чертят границы мира? — спросил Рауль, касаясь пульсирующей нити между кабинетами США, России, Китая, Израиля и Украины. — Внизу миллионы людей разбирают каждое слово Дональда Трампа и Владимира Путина, спорят о пекинских алгоритмах, ближневосточных шифрах и эмблеме ООН с азимутальной картой. И почти никто не замечает главного подвоха: человечеству уже сегодня предлагают безупречный, мягкий цифровой рай — в обмен на тихий отказ от собственной воли.","Мишель раскрыл потрёпанный том «Энциклопедии относительного и абсолютного знания», оставленный ему старым       const INITIAL_CHAPTERS_EN = [{"id":"chapter-1-en","number":1,"title":"The School of Aeden and the Mirror of Earth-18","subtitle":"How the eighteenth level of consciousness reflects inside corridors of power, mega-corporations, and secret maps","epigraph":"“Humans see only puppets on the stage of history; ants sense only the shadow of the Fingers; yet a true God notices that the map itself may be an aquarium beneath a dome.” — Edmond Wells","summary":"On the island of Olympia in Aeden, student gods Michael Pinson and Raoul Razorbak observe contemporary Earth-18 from the eighteenth level of consciousness. Drawing upon Edmond Wells’ Encyclopedia of Relative and Absolute Knowledge and all of Bernard Werber’s cycles—from The Ants and The Thanatonauts to The Tree of Possibilities and Welcome to Paradise—they trace hidden links between divine experiments, conspiracy architectures, Flat Earth hypotheses, mega-corporations, and the geopolitics of the USA, Russia, China, Israel, and Ukraine.","paragraphs":["When the artificial sunset faded inside the eighteenth-level lecture hall on the island of Olympia, Michael Pinson noticed something peculiar about the projection of Earth-18 resting on the marble table: from the altitude of the gods it spun as a luminous sphere, yet upon zooming in it unfolded into a flat disc ringed by an endless wall of Antarctic ice. Beside him, Raoul Razorbak smiled wryly as the lights of Washington, Moscow, Beijing, Jerusalem, and Kyiv pulsed in the dark like nerve ganglia inside the giant anthill of Bel-o-kan.","“Do you still believe earthly presidents and mega-corporation boards draw those borders on their own?” Raoul asked, tracing a glowing thread linking corridors across the United States, Russia, China, Israel, and Ukraine. “Down below, millions dissect every move by Donald Trump and Vladimir Putin, track Beijing’s algorithmic grids, Middle Eastern flashpoints, and global asset monopolies, and stare at the flat azimuthal map on the UN emblem—never realizing they are living through the same test depicted in ‘Welcome to Paradise’: trading genuine awakening for a comfortable scripted illusion.”","Michael opened the worn volume of the Encyclopedia of Relative and Absolute Knowledge left by Edmond Wells beside the first Thanatonaut logs and notes on the Third Humanity. Behind capital facades, corporate data centers, and restricted polar stations, slender silver threads of a new cycle converged at that exact second, and the ancient book on the lectern turned to its next blank page all by itself."],"source":"core","createdAt":"2026-11-20T00:00:00.000Z"}];
      const INITIAL_ENC_RU = [{"term":"Закон восемнадцатого порога","category":"Энциклопедия · Метаистория","text":"Согласно заметкам Эдмона Уэллса, любое сложное сообщество — от колонии термитов до сверхдержав и корпоративных холдингов — при достижении критической плотности информации распадается на две реальности: видимую для толпы и закрытую для посвящённых. То, что на Земле называют конспирологией, на деле служит прибором ночного видения, улавливающим чертёж раньше официальных новостей."},{"term":"Геометрия аквариума и спор о Плоской земле","category":"Энциклопедия · Картография сознания","text":"На азимутальной проекции с Северным полюсом в центре, ставшей эмблемой крупнейших международных союзов, Антарктида образует замкнутое ледяное кольцо вокруг океанов. Сторонники гипотезы Плоской земли видят в этом доказательство искусственного купола, тогда как Эдмон Уэллс отмечал: форма мира зависит от мерности наблюдателя — для муравья стол плоский, для ангела он сфера, для бога — шахматная доска."},{"term":"Пальцы над муравейником","category":"Энциклопедия · Этология","text":"В городе из двух миллионов муравьёв ни одна особь не видит общего плана, но колония действует как единый разум. Когда над стеклом появляются «Пальцы» существ высшего порядка, насекомые принимают их за катаклизм или войну. В человеческой политике роль невидимых феромонов выполняют расчётные алгоритмы корпораций, валютные шлюзы и ленты новостей."},{"term":"Контракт тихого рая","category":"Энциклопедия · Метафизика выбора","text":"Представьте душу, попавшую в безупречный цифровой курорт, где исполняют любое желание ещё до того, как оно оформится в мысль. Лишь спустя вечность выясняется цена мелкого шрифта: комфорт без сопротивления и тайны превращает бессмертие в пустую клетку."}];
      const INITIAL_ENC_EN = [{"term":"Law of the Eighteenth Threshold","category":"Encyclopedia · Metahistory","text":"According to Edmond Wells, whenever any complex community—from termite colonies to superpowers and holding empires—crosses a critical density of information, it splits into two realities: one staged for citizens and another reserved for architects. What Earth calls conspiracy theory is merely a night-vision lens catching hidden blueprints before press releases arrive."},{"term":"Aquarium Geometry & the Flat Earth Debate","category":"Encyclopedia · Cartography of Mind","text":"On the North-Pole azimuthal projection adopted by major global institutions, Antarctica forms a closed icy ring around the oceans. Modern Flat Earth theorists treat it as proof of a firmament dome, while Edmond Wells observed that geometry shifts with dimension: flat to the ant, spherical to the angel, and a chessboard to a god."},{"term":"The Fingers above Bel-o-kan","category":"Encyclopedia · Ethology","text":"Inside a city of two million ants, no single worker sees the whole blueprint, yet the colony moves as one mind. When the “Fingers” descend from above the glass terrarium, insects blame fate or rival nests. In human geopolitics, algorithmic feeds, reserve currencies, and corporate supply chains function as invisible pheromones."},{"term":"The Paradox of “Welcome to Paradise”","category":"Encyclopedia · Tree of Possibilities","text":"In Bernard Werber’s short story, a newcomer enters an immaculate simulated heaven only to realize that frictionless comfort turns eternity into a gilded cage. Global digital conglomerates dream of offering humanity the very same soft paradise in exchange for autonomous thought."}];
      const INITIAL_DOS_RU = [{"code":"ОЛИМПИЯ-01 · ПОЛИФОНИЯ СВЕРХДЕРЖАВ","title":"США, Россия, Китай, Израиль и Украина на одной доске","text":"Наблюдение фиксирует не отдельные разрозненные кризисы, а единую перенастройку мирового узла. За речами Вашингтона и Москвы, цифровыми шагами Пекина, киберконтурами Иерусалима и линией разлома в Украине прослеживается борьба транснациональных корпораций за контроль над чипами, энергетикой, орбитой и программируемыми деньгами."},{"code":"АРХИВ-18 · ДИРЕКТИВА 1959","title":"Закрытые широты и антарктический периметр","text":"На фоне тотальной спутниковой съёмки мегаполисов Антарктида остаётся пространством со строгими ограничениями для частных экспедиций и прямых южных перелётов. Исследователи альтернативных карт и криптоисторики сходятся в одном: за ледяной стеной скрыто нечто, ломающее привычную картину истории."},{"code":"ПРОТОКОЛ-7 · АРХИТЕКТОРЫ РАЯ НА ЗАКАЗ","title":"Крупные фонды и инженерия внимания","text":"Одни и те же глобальные управляющие корпорации одновременно владеют долями конкурирующих оборонных концернов, медиаимперий и лабораторий нейроинтерфейсов, превращая планету в управляемый эксперимент по переключению ветвей судьбы."}];

      let lang = settings.language === 'en' ? 'en' : 'ru';
      function sanitizeApkChapters(list) {
        const seen = new Set();

          const sig = (ch.title || '') + '::' + String(ch.paragraphs[0]).slice(0, 100);
          if (seen.has(sig)) return;
          seen.add(sig);
          out.push(Object.assign({}, ch, { number: out.length + 1 }));
        });
        return out.length ? out : list;
      }

      const RU_VOWELS = new Set('аеёиоуыэюяАЕЁИОУЫЭЮЯ'.split(''));
      const RU_ATTACH = new Set('йьъЙЬЪ'.split(''));
      function hyphenateRuWord(w) {
        if (w.length < 5 || !/^[а-яА-ЯёЁ]+$/.test(w)) return w;
        const c = w.split(''); const v = [];
        for (let i = 0; i < c.length; i++) if (RU_VOWELS.has(c[i])) v.push(i);
        if (v.length < 2) return w;
        const bp = new Set();
        for (let i = 0; i < v.length - 1; i++) {
          const s = v[i], e = v[i+1], gap = e - s - 1;
          let at = gap === 0 ? s + 1 : gap === 1 ? (RU_ATTACH.has(c[s+1]) ? s + 2 : s + 1) : s + 2;
          if (at >= 2 && c.length - at >= 2 && !RU_ATTACH.has(c[at])) bp.add(at);
        }
        return c.map((ch, idx) => (bp.has(idx) ? '\u00AD' + ch : ch)).join('');
      }
      const EN_VOWELS = new Set('aeiouyAEIOUY'.split(''));
      function hyphenateEnWord(w) {
        if (w.length < 6 || !/^[a-zA-Z]+$/.test(w)) return w;
        const c = w.split(''); const v = [];
        for (let i = 0; i < c.length; i++) {
          if (EN_VOWELS.has(c[i]) && (i === 0 || !EN_VOWELS.has(c[i-1]))) v.push(i);
        }
        if (v.length < 2) return w;
        const bp = new Set();
        for (let i = 0; i < v.length - 1; i++) {
          const s = v[i], e = v[i+1], gap = e - s - 1;
          const at = gap >= 2 ? s + 2 : s + 1;
          if (at >= 2 && c.length - at >= 3) bp.add(at);
        }
        return c.map((ch, idx) => (bp.has(idx) ? '\u00AD' + ch : ch)).join('');
      }
      function hyph(text) {
        if (!settings.hyphenation) return text;
        if (lang === 'en') return text.replace(/[a-zA-Z]{6,}/g, hyphenateEnWord);

      function findApkAnchorIndex(anchors, target) {
        if (!anchors.length || !target) return -1;
        let best = 0;
        for (let i = 0; i < anchors.length; i++) {
          const a = anchors[i];
          if (a.ch < target.ch || (a.ch === target.ch && a.b < target.b) || (a.ch === target.ch && a.b === target.b && a.w <= target.w)) {
            best = i;
          } else {
            break;
          }
        }
        return best;
      }

      function paginate() {
        const box = document.getElementById('page-content');
        const w = box.clientWidth;
        const h = box.clientHeight;
        if (w < 100 || h < 100) return;

        const m = document.createElement('div');
        m.lang = lang;
        m.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + w + 'px;box-sizing:border-box;visibility:hidden;';
        document.body.appendChild(m);
        const fits = (cand) => { m.innerHTML = renderHtml(cand); return m.scrollHeight <= h + 2; };

        const out = [];
        const outAnchors = [];
        let cur = [];
        const pushPage = () => {
          if (!cur.length) return;
          const first = cur[0];
          out.push(cur);
          outAnchors.push({ ch: first.ch || 0, b: first.b || 0, w: first.w || 0 });
          cur = [];
        };

        chapters.forEach((ch, chIdx) => {
          let bIdx = 0;
          if (cur.length > 0) pushPage();
          cur.push({ kind: 'header', ch: chIdx, b: bIdx++, w: 0, number: ch.number, title: ch.title, subtitle: ch.subtitle, epigraph: ch.epigraph });
          ch.paragraphs.forEach((p, idx) => {
            const pBlockIdx = bIdx++;
            const words = p.trim().split(/\s+/).filter(Boolean);
            let pos = 0;
            while (pos < words.length) {
              const rem = words.slice(pos);
              const full = { kind: 'p', ch: chIdx, b: pBlockIdx, w: pos, text: rem.join(' '), cont: pos > 0, first: idx === 0 };
              if (fits([...cur, full])) { cur.push(full); break; }
              let lo = 1, hi = rem.length - 1, best = 0;
              while (lo <= hi) {
                const mid = (lo + hi) >> 1;
                if (fits([...cur, { kind: 'p', ch: chIdx, b: pBlockIdx, w: pos, text: rem.slice(0, mid).join(' '), cont: pos > 0, first: idx === 0 }])) {
                  best = mid; lo = mid + 1;
                } else { hi = mid - 1; }
              }
              if (best < 3 && cur.length > 0) { pushPage(); continue; }
              if (best === 0) best = 1;
              if (rem.length - best === 1 && best > 3) best--;
              cur.push({ kind: 'p', ch: chIdx, b: pBlockIdx, w: pos, text: rem.slice(0, best).join(' '), cont: pos > 0, first: idx === 0 });
              pos += best;
              pushPage();
            }
            if (idx === 1 && ch.encyclopediaEntry) {
              const enc = { kind: 'enc', ch: chIdx, b: bIdx++, w: 0, ...ch.encyclopediaEntry };
              if (fits([...cur, enc])) cur.push(enc); else { pushPage(); cur = [enc]; }
            }
          });
          if (ch.dossierNote) {
            const dos = { kind: 'dos', ch: chIdx, b: bIdx++, w: 0, ...ch.dossierNote };
            if (fits([...cur, dos])) cur.push(dos); else { pushPage(); cur = [dos]; }
          }
        });
        pushPage();
        document.body.removeChild(m);
        pages = out;
        pageAnchors = outAnchors;
        if (currentAnchor) {
          const mapped = findApkAnchorIndex(pageAnchors, currentAnchor);
          if (mapped >= 0) pageIndex = mapped;
        }
        if (pageIndex >= pages.length) pageIndex = Math.max(0, pages.length - 1);
        if (oracleNum !== null) {
          openOracle(oracleNum, true);
        } else {
          drawPage();
        }
      }

      function buildNextApkBeat() {
        const pool = lang === 'en' ? OFFLINE_BEATS_EN : OFFLINE_BEATS_RU;
        const idx = genOffset;

        const lastCh = chapters[chapters.length - 1];
        const recent = lastCh && lastCh.paragraphs ? lastCh.paragraphs.slice(-2).join(' ') : '';
        if (idx < pool.length) {
          const base = pool[idx];
          const dyn = lang === 'en' ? DYN_EN : DYN_RU;
          const bridge = recent ? dyn.bridges[idx % dyn.bridges.length] : '';
          return {
            title: base.title,
            subtitle: base.subtitle,
            epigraph: base.epigraph,
            paragraphs: base.paragraphs.map((p, pIdx) => (pIdx === 0 && bridge ? bridge + ' ' + p : p)),
            enc: base.enc,
            dos: base.dos
          };
        }
        const dyn = lang === 'en' ? DYN_EN : DYN_RU;
        const d = idx - pool.length;
        const bridge = dyn.bridges[d % dyn.bridges.length];
        return {
          title: dyn.titles[d % dyn.titles.length],
          subtitle: dyn.subs[d % dyn.subs.length],
          epigraph: '',
          paragraphs: [
            bridge + ' ' + dyn.open[(d * 3 + 1) % dyn.open.length],
            dyn.mid[(d * 5 + 2) % dyn.mid.length],
            dyn.close[(d * 7 + 1) % dyn.close.length]
          ]
        };
      }

      function pushNewApkChapter() {

        safeSet(lang === 'en' ? 'kb_apk_gen_en' : 'kb_apk_gen', String(genOffset));
        return true;

      function pickApkUnused(len, arr, seed) {
        if (arr.length >= len) arr.length = 0;
        const used = new Set(arr); const pool = [];
        for (let k = 0; k < len; k++) if (!used.has(k)) pool.push(k);
        const idx = pool[Math.abs(seed) % pool.length];
        arr.push(idx); return idx;
      }

      function returnToApkBook() {
        const resumeIdx = oracleReturnPageIndex !== null ? oracleReturnPageIndex : pageIndex;
        oracleNum = null;
        oracleChapter = null;
        oracleReturnPageIndex = null;
        oracleNavStack = [];
        pageIndex = Math.max(0, Math.min(pages.length - 1, resumeIdx));
        drawPage();
      }
      document.getElementById('exit-oracle').onclick = returnToApkBook;

      function openOracle(n, keepExistingChapter, forceFresh, targetSubPage, pushHistory) {
        if (oracleNum === null) {
          oracleReturnPageIndex = pageIndex;
          oracleNavStack = [];
        } else if (pushHistory && oracleNum !== Math.max(1, Math.min(10000, n))) {
          const top = oracleNavStack[oracleNavStack.length - 1];
          if (!top || top.num !== oracleNum) {
            oracleNavStack.push({ num: oracleNum, sub: oracleSub });
          }
        }
        const clamped = Math.max(1, Math.min(10000, n));
        const cacheKey = lang + ':' + clamped;
        if (!keepExistingChapter) {
          if (!forceFresh && oraclePageCache[cacheKey]) {
            oracleChapter = oraclePageCache[cacheKey];
          } else {
            oracleNonce++;
            const seed = clamped * 131 + oracleNonce * 7919 + Date.now();
            const beatsPool = lang === 'en' ? OFFLINE_BEATS_EN : OFFLINE_BEATS_RU;
            const insPool = lang === 'en' ? ORACLE_INSIGHTS_EN : ORACLE_INSIGHTS;
            const metPool = lang === 'en' ? ORACLE_METAPHORS_EN : ORACLE_METAPHORS;
            const impPool = lang === 'en' ? ORACLE_IMPERATIVES_EN : ORACLE_IMPERATIVES;
            const beat = beatsPool[pickApkUnused(beatsPool.length, oracleHistory.b, seed)];
            const ins = insPool[pickApkUnused(insPool.length, oracleHistory.i, seed >> 3)];
            const met = metPool[pickApkUnused(metPool.length, oracleHistory.m, seed >> 5)];
            const imp = impPool[pickApkUnused(impPool.length, oracleHistory.p, seed >> 7)];
            safeSet('kb_apk_oracle_hist', JSON.stringify(oracleHistory));
            oracleChapter = {
              number: clamped,
              title: beat.title,
              subtitle: beat.subtitle,
              paragraphs: [
                beat.paragraphs[0],
                (lang === 'en' ? 'Number ' + clamped + ' opens a turning point. ' : 'Число ' + clamped + ' открывает узел размышления. ') + ins + ' — ' + met + '. ' + imp
              ],
              encyclopediaEntry: beat.enc,
              dossierNote: beat.dos
            };
            oraclePageCache[cacheKey] = oracleChapter;
          }
        }
        oracleNum = clamped;
        const box = document.getElementById('page-content');
        const w = box.clientWidth, h = box.clientHeight;
        if (w < 100 || h < 100) return;
        const m = document.createElement('div');
        m.lang = lang;
        m.style.cssText = 'position:fixed;left:-99999px;top:0;width:' + w + 'px;box-sizing:border-box;visibility:hidden;';
        document.body.appendChild(m);
        const fits = (cand) => { m.innerHTML = renderHtml(cand); return m.scrollHeight <= h + 2; };
        const out = []; let cur = [{ kind: 'header', isOracle: true, number: oracleChapter.number, title: oracleChapter.title, subtitle: oracleChapter.subtitle }];
        oracleChapter.paragraphs.forEach((p, idx) => {
          const words = p.trim().split(/\s+/).filter(Boolean); let pos = 0;
          while (pos < words.length) {
            const rem = words.slice(pos);
            const full = { kind: 'p', text: rem.join(' '), cont: pos > 0, first: idx === 0 };
            if (fits([...cur, full])) { cur.push(full); break; }
            let lo = 1, hi = rem.length - 1, best = 0;
            while (lo <= hi) {
              const mid = (lo + hi) >> 1;
              if (fits([...cur, { kind: 'p', text: rem.slice(0, mid).join(' '), cont: pos > 0, first: idx === 0 }])) { best = mid; lo = mid + 1; } else { hi = mid - 1; }
            }
            if (best < 3 && cur.length > 0) { out.push(cur); cur = []; continue; }
            if (best === 0) best = 1;
            if (rem.length - best === 1 && best > 3) best--;
            cur.push({ kind: 'p', text: rem.slice(0, best).join(' '), cont: pos > 0, first: idx === 0 });
            pos += best; out.push(cur); cur = [];
          }
        });
        if (cur.length > 0) out.push(cur);
        document.body.removeChild(m);
        oraclePages = out;
        if (targetSubPage === 'last') {
          oracleSub = Math.max(0, oraclePages.length - 1);
        } else if (typeof targetSubPage === 'number') {
          oracleSub = Math.min(Math.max(0, oraclePages.length - 1), Math.max(0, targetSubPage));
        } else if (!keepExistingChapter || oracleSub >= oraclePages.length) {
          oracleSub = 0;
        }
        drawOracle();
      }

      function drawOracle() {
        const resumeNum = (oracleReturnPageIndex !== null ? oracleReturnPageIndex : pageIndex) + 1;
        const resumeLabel = lang === 'en' ? '← Back to reading · p. ' + resumeNum : '← Вернуться к чтению · стр. ' + resumeNum;
        document.getElementById('exit-oracle').textContent = resumeLabel;
        document.getElementById('oracle-bar').classList.add('visible');
        const box = document.getElementById('page-content');
        box.innerHTML = renderHtml(oraclePages[oracleSub] || []);
        document.getElementById('page-meta').textContent = (lang === 'en' ? 'Page ' : 'Стр. ') + oracleNum;
        document.getElementById('btn-prev').disabled = oracleNum <= 1 && oracleSub === 0 && oracleNavStack.length === 0;
      }

      function applyApkLanguageUI() {
        const title = lang === 'en' ? 'Book of Gods' : 'Книга Богов';
        document.documentElement.lang = lang;
        document.title = title;
        document.getElementById('brand-title').textContent = title;
        document.getElementById('btn-archive').textContent = lang === 'en' ? 'Index' : 'Архив';
        document.getElementById('btn-settings').textContent = lang === 'en' ? 'Settings' : 'Настройки';
        document.getElementById('btn-jump').textContent = lang === 'en' ? 'Open' : 'Открыть';
        document.getElementById('lbl-settings-title').textContent = lang === 'en' ? 'Reading Settings (Offline)' : 'Настройки чтения (Офлайн)';
        document.getElementById('close-settings').textContent = lang === 'en' ? 'Close' : 'Закрыть';
        document.getElementById('lbl-theme-title').textContent = lang === 'en' ? 'Page Theme' : 'Тема страницы';
        document.getElementById('thm-parchment').textContent = lang === 'en' ? 'Parchment' : 'Пергамент';
        document.getElementById('thm-paper').textContent = lang === 'en' ? 'Paper' : 'Бумага';
        document.getElementById('thm-sepia').textContent = lang === 'en' ? 'Sepia' : 'Сепия';
        document.getElementById('thm-night').textContent = lang === 'en' ? 'Night' : 'Ночь';
        document.getElementById('lbl-font-title').textContent = lang === 'en' ? 'Font Size' : 'Размер шрифта';
        document.getElementById('lbl-hyphen-title').textContent = lang === 'en' ? 'Syllable Hyphenation' : 'Перенос слов по слогам';
        document.getElementById('lbl-justify-title').textContent = lang === 'en' ? 'Justified Text' : 'Выравнивание по ширине';
        document.getElementById('lbl-archive-title').textContent = lang === 'en' ? 'Encyclopedia & Dossiers' : 'Энциклопедия и Досье';
        document.getElementById('close-archive').textContent = lang === 'en' ? 'Close' : 'Закрыть';
        const ruBtn = document.getElementById('lang-ru');
        const enBtn = document.getElementById('lang-en');
        ruBtn.className = lang === 'ru' ? 'primary' : '';
        enBtn.className = lang === 'en' ? 'primary' : '';
        ruBtn.style.cssText = 'min-height:28px;padding:3px 7px;font-size:11px;border:none;';
        enBtn.style.cssText = 'min-height:28px;padding:3px 7px;font-size:11px;border:none;';
        applyTheme();
      }

      function switchApkLanguage(nextLang) {
        if (nextLang === lang) return;
        lang = nextLang;
        settings.language = lang;
        safeSet('kb_apk_settings', JSON.stringify(settings));
        oracleNum = null;
        oracleChapter = null;
        oracleReturnPageIndex = null;
        oracleNavStack = [];
        chapters = getSavedChapters(lang);
        pageIndex = Number(safeGet(lang === 'en' ? 'kb_apk_page_en' : 'kb_apk_page') || '0') || 0;
        currentAnchor = loadApkAnchor(lang);
        genOffset = Number(safeGet(lang === 'en' ? 'kb_apk_gen_en' : 'kb_apk_gen') || '0') || 0;
        applyApkLanguageUI();
        paginate();
      }
      document.getElementById('lang-ru').onclick = () => switchApkLanguage('ru');
      document.getElementById('lang-en').onclick = () => switchApkLanguage('en');

      function triggerJump() {
        const inp = document.getElementById('apk-page-input');
        const val = parseInt(inp.value, 10);
        if (!val || val < 1) return;
        const clamped = Math.min(10000, val);
        inp.value = '';
        inp.blur();
        setTimeout(() => openOracle(clamped, false, true, 0, oracleNum !== null), 140);
      }
      document.getElementById('btn-jump').onclick = triggerJump;
      document.getElementById('apk-page-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); triggerJump(); }
      });

      document.getElementById('btn-prev').onclick = () => {
        if (oracleNum !== null) {
          if (oracleSub > 0) { oracleSub--; drawOracle(); return; }
          const prevVisited = oracleNavStack.pop();
          if (prevVisited) {
            openOracle(prevVisited.num, false, false, prevVisited.sub, false);
            return;
          }
          if (oracleNum <= 1) { returnToApkBook(); return; }
          openOracle(oracleNum - 1, false, false, 'last', false);
          return;
        }
        if (pageIndex > 0) { pageIndex--; drawPage(); }
      };
      document.getElementById('btn-next').onclick = () => {
        if (oracleNum !== null) {
          if (oracleSub < oraclePages.length - 1) { oracleSub++; drawOracle(); }
          else if (oracleNum < 10000) { openOracle(oracleNum + 1, false, false, 0, true); }
          return;
        }
        if (pageIndex < pages.length - 1) { pageIndex++; drawPage(); } else { generateNextPage(); }
      };

      let touchX = 0;
      let touchY = 0;
      const touchEl = document.getElementById('touch-area');
      touchEl.addEventListener('touchstart', e => {
        touchX = e.changedTouches[0].clientX;
        touchY = e.changedTouches[0].clientY;
      }, { passive: true });
      touchEl.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - touchX;
        const dy = e.changedTouches[0].clientY - touchY;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          if (dx < 0) document.getElementById('btn-next').click();
          else document.getElementById('btn-prev').click();
        }
      }, { passive: true });

      document.getElementById('btn-settings').onclick = () => document.getElementById('drawer-settings').classList.add('open');
      document.getElementById('close-settings').onclick = () => document.getElementById('drawer-settings').classList.remove('open');
      document.getElementById('btn-archive').onclick = () => {
        const list = document.getElementById('archive-list');
        const encList = lang === 'en' ? INITIAL_ENC_EN : INITIAL_ENC_RU;
        const dosList = lang === 'en' ? INITIAL_DOS_EN : INITIAL_DOS_RU;
        list.innerHTML = encList.map(e => '<div class="box-enc"><strong>' + e.term + '</strong><div>' + e.text + '</div></div>').join('') +
          dosList.map(d => '<div class="box-dos"><strong>' + d.title + '</strong><div>' + d.text + '</div></div>').join('');
        document.getElementById('drawer-archive').classList.add('open');
      };
      document.getElementById('close-archive').onclick = () => document.getElementById('drawer-archive').classList.remove('open');

      document.querySelectorAll('[data-theme]').forEach(btn => {
        btn.onclick = () => { settings.theme = btn.dataset.theme; safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); };
      });
      document.getElementById('size-dec').onclick = () => { settings.fontSize = Math.max(15, settings.fontSize - 1); safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };
      document.getElementById('size-inc').onclick = () => { settings.fontSize = Math.min(24, settings.fontSize + 1); safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };
      document.getElementById('toggle-hyphen').onclick = () => { settings.hyphenation = !settings.hyphenation; safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };
      document.getElementById('toggle-justify').onclick = () => { settings.justifyText = !settings.justifyText; safeSet('kb_apk_settings', JSON.stringify(settings)); applyTheme(); paginate(); };

      let resizeTimer;
      const handleResize = () => {
        const activeId = document.activeElement && document.activeElement.id;
        const box = document.getElementById('page-content');
        if (activeId === 'apk-page-input' && box && box.clientHeight < 420) return;
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(paginate, 120);
      };
      window.addEventListener('resize', handleResize);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', handleResize);

      applyApkLanguageUI();
      setTimeout(paginate, 50);
    })();
  </script>
</body>
</html>
