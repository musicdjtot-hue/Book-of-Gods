name: Build Android 17 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 17 / fallback platform tools
        shell: bash
        run: |
          set +o pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          AVAILABLE="$(sdkmanager --list 2>/dev/null || true)"

          PLATFORM_PKG=""
          TARGET_SDK="36"
          for candidate in "platforms;android-37.0" "platforms;android-37" "platforms;android-36.1" "platforms;android-36.0" "platforms;android-36" "platforms;android-35"; do
            if printf '%s\n' "$AVAILABLE" | grep -Eq "(^|[[:space:]])${candidate}([[:space:]]|$)"; then
              PLATFORM_PKG="$candidate"
              case "$candidate" in
                *37*) TARGET_SDK="37" ;;
                *36*) TARGET_SDK="36" ;;
                *) TARGET_SDK="35" ;;
              esac
              break
            fi
          done

          if [ -z "$PLATFORM_PKG" ]; then
            PLATFORM_PKG="platforms;android-35"
            TARGET_SDK="35"
          fi

          BUILD_TOOLS_PKG="$(printf '%s\n' "$AVAILABLE" | grep -oE 'build-tools;(37|36|35)\.[0-9]+\.[0-9]+' | sort -Vu | tail -n1 || true)"
          if [ -z "$BUILD_TOOLS_PKG" ]; then
            BUILD_TOOLS_PKG="build-tools;35.0.1"
          fi

          echo "Installing $PLATFORM_PKG and $BUILD_TOOLS_PKG (target=$TARGET_SDK)"
          sdkmanager "platform-tools" "$PLATFORM_PKG" "$BUILD_TOOLS_PKG"

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi
          if [ -d "$SDK_ROOT/platforms/android-36.1" ] && [ ! -e "$SDK_ROOT/platforms/android-36" ]; then
            ln -s "$SDK_ROOT/platforms/android-36.1" "$SDK_ROOT/platforms/android-36"
          elif [ -d "$SDK_ROOT/platforms/android-36.0" ] && [ ! -e "$SDK_ROOT/platforms/android-36" ]; then
            ln -s "$SDK_ROOT/platforms/android-36.0" "$SDK_ROOT/platforms/android-36"
          fi

          echo "ANDROID_TARGET_SDK=$TARGET_SDK" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -PandroidTargetSdk=${{ env.ANDROID_TARGET_SDK }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: kniga-bogov-android17-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
