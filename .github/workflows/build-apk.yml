name: Build Android 17 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 / fallback platform tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          if sdkmanager --list | grep -q "platforms;android-37"; then
            echo "ANDROID_TARGET_SDK=37" >> $GITHUB_ENV
            sdkmanager "platforms;android-37" "build-tools;36.0.0"
          else
            echo "ANDROID_TARGET_SDK=36" >> $GITHUB_ENV
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon -PandroidTargetSdk=${{ env.ANDROID_TARGET_SDK }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kniga-bogov-android17-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
